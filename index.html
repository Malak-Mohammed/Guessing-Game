<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Family Vocabulary Fun!</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for kid-friendly typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .silhouette {
            filter: brightness(0) invert(0.8) drop-shadow(0 8px 12px rgba(0,0,0,0.2));
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .revealed {
            filter: brightness(1) invert(0) drop-shadow(0 12px 20px rgba(0,0,0,0.15));
            transform: scale(1.05);
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-between p-2 md:p-4 select-none box-border">

    <!-- Main Game Arena -->
    <main class="w-full max-w-xl flex-1 flex flex-col items-center justify-around my-auto">
        
        <!-- Big Question & Speaker Button Header -->
        <div class="flex items-center justify-center space-x-3 w-full px-2 pop-in">
            <h1 id="question-text" class="text-2xl md:text-4xl font-black text-indigo-900 tracking-wide">
                Who's this? 🤔
            </h1>
            <button onclick="speakPrompt()" class="bg-amber-400 hover:bg-amber-500 text-white font-bold p-2.5 md:p-3 rounded-2xl shadow-md transition transform active:scale-95 flex items-center justify-center text-xl md:text-2xl" title="Repeat Question">
                🔊
            </button>
        </div>

        <!-- Mystery Family Member Card -->
        <div class="relative bg-white/95 backdrop-blur-sm rounded-3xl p-3 shadow-xl border-4 border-white w-full max-w-sm flex flex-col items-center justify-center pop-in h-[180px] md:h-[240px]">
            <div id="confetti-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center text-5xl opacity-0 transition-opacity duration-300">🎉</div>
            <div id="image-container" class="transition-all duration-500 flex items-center justify-center">
                <!-- Dynamically filled avatar placeholder -->
                <div id="avatar-display" class="text-7xl md:text-9xl silhouette">👶</div>
            </div>
            <div id="success-banner" class="absolute bottom-2.5 bg-green-500 text-white font-black px-5 py-1 rounded-full shadow-lg opacity-0 transform translate-y-3 transition-all duration-300 text-base md:text-xl">
                ✨ It's my <span id="target-name-banner">mother</span>! ✨
            </div>
        </div>

        <!-- Multiple Choice Options Grid -->
        <div id="options-grid" class="grid grid-cols-2 gap-2.5 w-full max-w-sm">
            <!-- Buttons generated dynamically via JS -->
        </div>

    </main>

    <!-- Footer / Next Button & Credit Banner with Stars Included -->
    <footer class="w-full max-w-xl flex flex-col items-center space-y-1.5 pb-1 shrink-0">
        <button id="next-btn" onclick="nextRound()" class="hidden bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-black text-lg px-8 py-2.5 rounded-2xl shadow-lg border-2 border-white transform hover:scale-105 active:scale-95 transition flex items-center space-x-2">
            <span>Next Round!</span>
            <span class="text-xl">➡️</span>
        </button>

        <!-- Credit Banner with Score Stars Embedded -->
        <div class="w-full bg-yellow-50/95 backdrop-blur-sm text-center py-2 px-4 rounded-2xl shadow-md border-2 border-yellow-300 flex items-center justify-between">
            <div id="stars-container" class="flex space-x-0.5 text-sm md:text-lg" title="Score Stars">
                ⭐ ⭐ ⭐
            </div>
            <span class="text-base md:text-xl font-black text-rose-600 tracking-wide drop-shadow-sm">🎨 Teacher Nada ✨</span>
            <div class="w-10"></div> <!-- Spacer for perfect centering balance -->
        </div>
    </footer>

    <!-- Notification Message Modal -->
    <div id="message-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-indigo-200 pop-in">
            <div id="modal-icon" class="text-6xl mb-2">🌟</div>
            <h3 id="modal-title" class="text-2xl font-black text-indigo-900 mb-1">Awesome Job!</h3>
            <p id="modal-desc" class="text-gray-600 mb-5 text-lg font-semibold">You found all family members!</p>
            <button onclick="closeModal()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-black text-xl py-3 rounded-2xl shadow-md transition">
                Play Again! 🚀
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // Family Vocabulary Data Set
        const familyData = [
            { name: "mother", emoji: "👩", alt: "Mom" },
            { name: "father", emoji: "👨", alt: "Dad" },
            { name: "brother", emoji: "👦", alt: "Brother" },
            { name: "sister", emoji: "👧", alt: "Sister" },
            { name: "grandmother", emoji: "👵", alt: "grandma" },
            { name: "grandfather", emoji: "👴", alt: "grandpa" }
        ];

        let currentTarget = null;
        let score = 0;
        let roundCount = 0;
        const totalRoundsToWin = 5;
        let isAnswered = false;
        let availableCharacters = [];

        // Web Audio API Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function speakText(text, onEndCallback = null) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.78;
                utterance.pitch = 1.28;
                if (onEndCallback) {
                    utterance.onend = onEndCallback;
                    utterance.onerror = onEndCallback;
                }
                window.speechSynthesis.speak(utterance);
            } else {
                if (onEndCallback) onEndCallback();
            }
        }

        function speakPrompt() {
            speakText("Who's this?");
        }

        function initGame() {
            score = 0;
            roundCount = 0;
            resetAvailableCharacters();
            updateStarsDisplay();
            nextRound();
        }

        function resetAvailableCharacters() {
            availableCharacters = [...familyData].sort(() => Math.random() - 0.5);
        }

        function nextRound() {
            isAnswered = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('success-banner').classList.remove('opacity-100', 'translate-y-0');
            document.getElementById('success-banner').classList.add('opacity-0', 'translate-y-3');
            
            const avatarDisplay = document.getElementById('avatar-display');
            avatarDisplay.classList.remove('revealed');
            avatarDisplay.classList.add('silhouette');

            if (availableCharacters.length === 0) {
                resetAvailableCharacters();
            }
            currentTarget = availableCharacters.pop();
            avatarDisplay.innerText = currentTarget.emoji;

            let options = [currentTarget.name];
            while (options.length < 4) {
                let randomMember = familyData[Math.floor(Math.random() * familyData.length)].name;
                if (!options.includes(randomMember)) {
                    options.push(randomMember);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-white hover:bg-indigo-50 text-indigo-900 font-bold text-base md:text-xl py-2.5 px-3 rounded-2xl shadow-md border-2 border-indigo-100 transition transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center";
                btn.innerText = opt;
                btn.onclick = () => handleChoice(opt, btn);
                grid.appendChild(btn);
            });

            speakPrompt();
        }

        function handleChoice(selectedName, btnElement) {
            if (isAnswered) return;

            if (selectedName === currentTarget.name) {
                isAnswered = true;
                playSound('success');
                score++;
                roundCount++;

                const avatarDisplay = document.getElementById('avatar-display');
                avatarDisplay.classList.remove('silhouette');
                avatarDisplay.classList.add('revealed');

                document.getElementById('target-name-banner').innerText = currentTarget.name.toLowerCase();
                const banner = document.getElementById('success-banner');
                banner.classList.remove('opacity-0', 'translate-y-3');
                banner.classList.add('opacity-100', 'translate-y-0');

                updateStarsDisplay();

                if (roundCount >= totalRoundsToWin) {
                    speakText(`It's my ${currentTarget.name.toLowerCase()}! Amazing job! You completed the family quest!`, () => {
                        showWinModal();
                    });
                } else {
                    speakText(`It's my ${currentTarget.name.toLowerCase()}!`);
                    setTimeout(() => {
                        document.getElementById('next-btn').classList.remove('hidden');
                    }, 500);
                }

                btnElement.className = "bg-green-500 text-white font-bold text-base md:text-xl py-2.5 px-3 rounded-2xl shadow-lg border-2 border-white transition transform scale-105 flex items-center justify-center";

            } else {
                playSound('error');
                speakText("Try again!");
                btnElement.className = "bg-red-100 text-red-500 font-bold text-base md:text-xl py-2.5 px-3 rounded-2xl shadow-sm border-2 border-red-200 transition transform shake flex items-center justify-center";
                setTimeout(() => {
                    btnElement.className = "bg-white hover:bg-indigo-50 text-indigo-900 font-bold text-base md:text-xl py-2.5 px-3 rounded-2xl shadow-md border-2 border-indigo-100 transition transform hover:-translate-y-0.5 active:scale-95 flex items-center justify-center";
                }, 400);
            }
        }

        function updateStarsDisplay() {
            let starsStr = '';
            for (let i = 0; i < totalRoundsToWin; i++) {
                if (i < score) {
                    starsStr += '⭐';
                } else {
                    starsStr += '⚪';
                }
            }
            document.getElementById('stars-container').innerText = starsStr;
        }

        function showWinModal() {
            playSound('success');
            document.getElementById('modal-title').innerText = "Awesome Job! 🎉";
            document.getElementById('modal-desc').innerText = `You earned ${score} stars practicing your family words!`;
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('message-modal').classList.add('hidden');
            initGame();
        }

        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
